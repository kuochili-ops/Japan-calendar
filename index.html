<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>浮世繪白六・3D 環捲翻頁月曆</title>
  <style>
    :root {
      --washi-bg: #e7dfd0;
      --paper-surface: #fbf8f1;
      --paper-shadow: rgba(34, 25, 16, 0.28);
      --ink-main: #221a13;
      --ink-sub: #6c5f50;
      --ink-muted: #aba092;
      --accent-vermilion: #b83b28;
      --accent-lunar: #294b66;
      --accent-holiday: #9f3524;
      --line-soft: rgba(92, 75, 56, 0.2);
      --line-strong: rgba(92, 75, 56, 0.42);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overscroll-behavior: none;
      background-color: var(--washi-bg);
      background-image:
        radial-gradient(circle at 16% 10%, rgba(255, 253, 247, 0.85), transparent 44%),
        radial-gradient(circle at 86% 90%, rgba(158, 134, 100, 0.22), transparent 52%);
      color: var(--ink-main);
      font-family: "Noto Serif TC", "Songti TC", "PingFang TC", "Microsoft JhengHei", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 10px 12px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .zoom-viewport {
      width: 100%;
      max-width: 680px;
      height: calc(100dvh - 42px);
      max-height: 920px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .calendar-shell {
      width: 100%;
      height: 100%;
      position: relative;
      box-shadow:
        0 18px 38px var(--paper-shadow),
        0 3px 8px rgba(34, 25, 16, 0.14);
      border-radius: 5px;
      overflow: hidden;
      background: var(--paper-surface);
      cursor: grab;
      perspective: 1600px;
      -webkit-perspective: 1600px;
    }

    .calendar-shell:active {
      cursor: grabbing;
    }

    .flip-stage {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }

    /* 常駐 GPU 合成圖層的半頁容器 */
    .half-pane {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background: var(--paper-surface);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .half-pane.top-half {
      top: 0;
      transform-origin: 50% 100%;
      -webkit-transform-origin: 50% 100%;
      border-bottom: 1px solid rgba(72, 58, 42, 0.3);
    }

    .half-pane.bottom-half {
      top: 50%;
      transform-origin: 50% 0%;
      -webkit-transform-origin: 50% 0%;
    }

    .half-pane.hidden-leaf {
      visibility: hidden;
      pointer-events: none;
    }

    .shade-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      will-change: opacity;
    }

    .half-pane.top-half .shade-overlay {
      background: linear-gradient(to top, rgba(24, 18, 12, 0.42) 0%, rgba(24, 18, 12, 0.1) 55%, rgba(255, 255, 255, 0.12) 100%);
    }

    .half-pane.bottom-half .shade-overlay {
      background: linear-gradient(to bottom, rgba(24, 18, 12, 0.42) 0%, rgba(24, 18, 12, 0.1) 55%, rgba(255, 255, 255, 0.12) 100%);
    }

    .punch-holes {
      position: absolute;
      left: 0;
      right: 0;
      height: 12px;
      padding: 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .half-pane.top-half .punch-holes {
      bottom: 2px;
    }

    .half-pane.bottom-half .punch-holes {
      top: 2px;
    }

    .punch-hole {
      width: 11px;
      height: 11px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .punch-hole::after {
      content: "";
      width: 7px;
      height: 4.5px;
      border-radius: 50%;
      background: #2b231c;
      box-shadow: inset 0 1px 1.5px rgba(0, 0, 0, 0.85), 0 0.5px 0 rgba(255, 255, 255, 0.45);
    }

    /* 中縫：金屬雙線圈環捲（精準位於 50% 中軸線上） */
    .coil-bridge {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 22px;
      transform: translateY(-50%) translateZ(4px);
      -webkit-transform: translateY(-50%) translateZ(4px);
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      pointer-events: none;
    }

    .coil-unit {
      position: relative;
      width: 11px;
      height: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .coil-wire {
      position: relative;
      width: 6px;
      height: 17px;
      border-radius: 3px;
      background: linear-gradient(
        90deg,
        #3d352e 0%,
        #8f8477 25%,
        #f2ece1 50%,
        #6e6357 78%,
        #2b241e 100%
      );
      box-shadow:
        1.5px 2px 3px rgba(24, 18, 12, 0.35),
        inset 0 0 1px rgba(255, 255, 255, 0.6);
    }

    .art-content {
      width: 100%;
      height: 100%;
      background: #e3dccb;
    }

    .art-content img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .lower-content {
      width: 100%;
      height: 100%;
      background: var(--paper-surface);
      display: flex;
      flex-direction: column;
      padding-top: 11px;
      box-shadow: inset 0 8px 12px -8px rgba(45, 34, 22, 0.25);
    }

    .month-header-bar {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      height: 28px;
      padding: 0 12px;
      flex-shrink: 0;
    }

    .month-name-en {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink-main);
    }

    .month-year-num {
      font-size: 0.94rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--ink-sub);
      font-variant-numeric: tabular-nums;
    }

    .month-grid-wrap {
      flex: 1;
      min-height: 0;
      padding: 0 10px 10px;
      display: flex;
      flex-direction: column;
    }

    .dow-row {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      text-align: center;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--ink-sub);
      height: 22px;
      align-items: center;
      border-bottom: 1.5px solid var(--line-strong);
      flex-shrink: 0;
    }

    .dow-row span {
      min-width: 0;
      overflow: hidden;
    }

    .dow-row span:first-child,
    .dow-row span:last-child {
      color: var(--accent-vermilion);
    }

    .dates-table {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-left: 1px solid var(--line-soft);
    }

    .date-box {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 3px 3px 2px 4px;
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .date-box.dimmed {
      background: rgba(168, 155, 138, 0.06);
    }

    .date-box.weekend:not(.dimmed) {
      background: rgba(184, 59, 40, 0.025);
    }

    .date-box.today-mark {
      background: rgba(184, 59, 40, 0.09);
      box-shadow: inset 0 0 0 1.5px var(--accent-vermilion);
    }

    .box-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1px;
      min-width: 0;
    }

    .solar-day {
      font-size: clamp(0.76rem, 2.3vw, 0.92rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--ink-main);
      flex-shrink: 0;
    }

    .date-box.dimmed .solar-day {
      color: var(--ink-muted);
      font-weight: 500;
    }

    .date-box.weekend:not(.dimmed) .solar-day,
    .date-box.holiday:not(.dimmed) .solar-day {
      color: var(--accent-vermilion);
    }

    .lunar-tag {
      font-size: clamp(0.48rem, 1.45vw, 0.58rem);
      line-height: 1.05;
      color: var(--ink-sub);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      padding-top: 1px;
    }

    .date-box.dimmed .lunar-tag {
      color: #b7ad9f;
    }

    .lunar-tag.month-start {
      color: var(--accent-lunar);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-color: rgba(41, 75, 102, 0.45);
      text-underline-offset: 2px;
    }

    .festival-tag {
      font-size: clamp(0.46rem, 1.4vw, 0.56rem);
      line-height: 1.05;
      color: var(--accent-holiday);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .date-box.dimmed .festival-tag {
      color: #c29b93;
    }

    .gesture-tip {
      margin-top: 6px;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--ink-sub);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="zoom-viewport" id="zoomViewport">
    <div class="calendar-shell" id="calendarShell">
      <div class="flip-stage" id="flipStage"></div>
    </div>
  </div>

  <div class="gesture-tip">單指上下撥動即時翻頁｜雙指捏合縮放・雙擊還原</div>

  <script>
    const MONTH_LABELS = [
      "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",
      "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"
    ];

    const WEEKDAY_ABBR = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

    const LUNAR_MONTH_WORDS = [
      "正", "二", "三", "四", "五", "六",
      "七", "八", "九", "十", "冬", "臘"
    ];

    const LUNAR_DAY_WORDS = [
      "初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十",
      "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十",
      "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"
    ];

    const SOLAR_FESTIVALS = {
      "1-1": "元旦",
      "2-28": "和平紀念",
      "4-4": "兒童節",
      "4-5": "清明節",
      "5-1": "勞動節",
      "10-10": "國慶日",
      "12-25": "行憲紀念"
    };

    const LUNAR_FESTIVALS = {
      "1-1": "春節",
      "1-2": "初二",
      "1-3": "初三",
      "1-15": "元宵",
      "5-5": "端午節",
      "7-7": "七夕",
      "7-15": "中元節",
      "8-15": "中秋節",
      "9-9": "重陽節"
    };

    const COIL_COUNT = 16;

    // 預先下載並強制解碼全部 12 張插畫，確保 GPU 紋理常駐不重新解碼
    const decodedImgSrcs = new Array(12);
    for (let m = 0; m < 12; m++) {
      const src = `images/${String(m + 1).padStart(2, "0")}.png`;
      decodedImgSrcs[m] = src;
      const img = new Image();
      img.decoding = "sync";
      img.src = src;
      if (img.decode) {
        img.decode().catch(() => {});
      }
    }

    let audioCtx = null;
    function playPaperFlipSound(dir, intensity = 1) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const dur = 0.18;
        const len = Math.floor(audioCtx.sampleRate * dur);
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const ch = buf.getChannelData(0);
        const amp = Math.min(0.16, 0.07 + intensity * 0.07);
        for (let i = 0; i < len; i++) {
          const p = i / len;
          ch[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * p) * (1 - p * 0.28) * amp;
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(dir > 0 ? 1160 : 960, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(dir > 0 ? 1740 : 690, audioCtx.currentTime + dur);
        filter.Q.value = 1.4;
        src.connect(filter);
        filter.connect(audioCtx.destination);
        src.start();
      } catch (_) {}
    }

    const lunarCache = new Map();
    function getLunarInfo(y, m0, d) {
      const key = `${y}-${m0}-${d}`;
      if (lunarCache.has(key)) return lunarCache.get(key);
      let res = { text: "", isMonthStart: false, festival: "" };
      try {
        const fmt = new Intl.DateTimeFormat("zh-TW-u-ca-chinese", {
          month: "numeric",
          day: "numeric"
        });
        const parts = fmt.formatToParts(new Date(y, m0, d));
        let mNum = null;
        let leap = false;
        let dNum = null;

        for (const part of parts) {
          if (part.type === "month") {
            leap = part.value.includes("閏") || part.value.includes("闰");
            const digits = parseInt(part.value.replace(/[^\d]/g, ""), 10);
            if (!Number.isNaN(digits)) {
              mNum = digits;
            } else {
              const zhMap = {
                "正": 1, "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6,
                "七": 7, "八": 8, "九": 9, "十": 10, "冬": 11, "十一": 11, "臘": 12, "腊": 12, "十二": 12
              };
              for (const k in zhMap) {
                if (part.value.includes(k)) {
                  mNum = zhMap[k];
                  break;
                }
              }
            }
          } else if (part.type === "day") {
            const parsed = parseInt(part.value.replace(/[^\d]/g, ""), 10);
            if (!Number.isNaN(parsed)) dNum = parsed;
          }
        }

        const lunarFest = (!leap && mNum && dNum) ? (LUNAR_FESTIVALS[`${mNum}-${dNum}`] || "") : "";
        if (dNum === 1 && mNum) {
          const mWord = (leap ? "閏" : "") + (LUNAR_MONTH_WORDS[mNum - 1] || `${mNum}`);
          res = { text: `${mWord}月初一`, isMonthStart: true, festival: lunarFest };
        } else if (dNum && dNum >= 1 && dNum <= 30) {
          res = { text: LUNAR_DAY_WORDS[dNum - 1], isMonthStart: false, festival: lunarFest };
        }
      } catch (_) {}
      lunarCache.set(key, res);
      return res;
    }

    const matrixCache = new Map();
    function buildMonthMatrix(year, month0) {
      const key = `${year}-${month0}`;
      if (matrixCache.has(key)) return matrixCache.get(key);

      const firstOfMonth = new Date(year, month0, 1);
      const startDow = firstOfMonth.getDay();
      const daysInCur = new Date(year, month0 + 1, 0).getDate();
      const daysInPrev = new Date(year, month0, 0).getDate();
      const totalSlots = startDow + daysInCur > 35 ? 42 : 35;

      const today = new Date();
      const tY = today.getFullYear();
      const tM = today.getMonth();
      const tD = today.getDate();

      const cells = [];
      for (let idx = 0; idx < totalSlots; idx++) {
        let cellY = year;
        let cellM = month0;
        let dayVal;
        let dimmed = false;

        if (idx < startDow) {
          dayVal = daysInPrev - (startDow - 1 - idx);
          cellM = month0 - 1;
          if (cellM < 0) {
            cellM = 11;
            cellY = year - 1;
          }
          dimmed = true;
        } else if (idx >= startDow + daysInCur) {
          dayVal = idx - (startDow + daysInCur) + 1;
          cellM = month0 + 1;
          if (cellM > 11) {
            cellM = 0;
            cellY = year + 1;
          }
          dimmed = true;
        } else {
          dayVal = idx - startDow + 1;
        }

        const isToday = cellY === tY && cellM === tM && dayVal === tD;
        const lunar = getLunarInfo(cellY, cellM, dayVal);
        const solarFest = SOLAR_FESTIVALS[`${cellM + 1}-${dayVal}`] || "";
        const festival = solarFest || lunar.festival;
        const isHoliday = Boolean(solarFest || (lunar.festival && lunar.festival !== "初二" && lunar.festival !== "初三" && lunar.festival !== "七夕" && lunar.festival !== "重陽節"));

        cells.push({ dayVal, dimmed, isToday, lunar, festival, isHoliday });
      }
      matrixCache.set(key, cells);
      return cells;
    }

    function createPunchHoles() {
      const holes = document.createElement("div");
      holes.className = "punch-holes";
      for (let i = 0; i < COIL_COUNT; i++) {
        const hole = document.createElement("span");
        hole.className = "punch-hole";
        holes.appendChild(hole);
      }
      return holes;
    }

    // 建立常駐 DOM 圖層池（翻頁全程不銷毀或重建節點，達成 0ms 瞬時反應）
    function createPersistentTopSlot(zIndex, hidden) {
      const pane = document.createElement("div");
      pane.className = "half-pane top-half" + (hidden ? " hidden-leaf" : "");
      pane.style.zIndex = String(zIndex);

      const art = document.createElement("div");
      art.className = "art-content";
      const img = document.createElement("img");
      img.decoding = "sync";
      art.appendChild(img);
      pane.appendChild(art);

      pane.appendChild(createPunchHoles());

      const shade = document.createElement("div");
      shade.className = "shade-overlay";
      pane.appendChild(shade);

      return {
        pane,
        img,
        shade,
        currentMonth0: -1,
        bind(year, month0) {
          if (this.currentMonth0 !== month0) {
            this.img.src = decodedImgSrcs[month0];
            this.currentMonth0 = month0;
          }
        }
      };
    }

    function createPersistentBottomSlot(zIndex, hidden) {
      const pane = document.createElement("div");
      pane.className = "half-pane bottom-half" + (hidden ? " hidden-leaf" : "");
      pane.style.zIndex = String(zIndex);

      pane.appendChild(createPunchHoles());

      const lower = document.createElement("div");
      lower.className = "lower-content";

      const headerBar = document.createElement("div");
      headerBar.className = "month-header-bar";
      const mName = document.createElement("span");
      mName.className = "month-name-en";
      const yNum = document.createElement("span");
      yNum.className = "month-year-num";
      headerBar.appendChild(mName);
      headerBar.appendChild(yNum);
      lower.appendChild(headerBar);

      const wrap = document.createElement("div");
      wrap.className = "month-grid-wrap";

      const dowRow = document.createElement("div");
      dowRow.className = "dow-row";
      WEEKDAY_ABBR.forEach((abbr) => {
        const el = document.createElement("span");
        el.textContent = abbr;
        dowRow.appendChild(el);
      });
      wrap.appendChild(dowRow);

      const table = document.createElement("div");
      table.className = "dates-table";

      // 預先建立 42 個格子節點並重複利用
      const cellSlots = [];
      for (let i = 0; i < 42; i++) {
        const box = document.createElement("div");
        box.className = "date-box";
        const isWk = (i % 7 === 0 || i % 7 === 6);

        const top = document.createElement("div");
        top.className = "box-top";

        const solarEl = document.createElement("span");
        solarEl.className = "solar-day";

        const lunarEl = document.createElement("span");
        lunarEl.className = "lunar-tag";

        top.appendChild(solarEl);
        top.appendChild(lunarEl);
        box.appendChild(top);

        const festEl = document.createElement("div");
        festEl.className = "festival-tag";
        box.appendChild(festEl);

        table.appendChild(box);
        cellSlots.push({ box, solarEl, lunarEl, festEl, isWk });
      }

      wrap.appendChild(table);
      lower.appendChild(wrap);
      pane.appendChild(lower);

      const shade = document.createElement("div");
      shade.className = "shade-overlay";
      pane.appendChild(shade);

      return {
        pane,
        shade,
        currentKey: "",
        bind(year, month0) {
          const key = `${year}-${month0}`;
          if (this.currentKey === key) return;
          this.currentKey = key;

          mName.textContent = MONTH_LABELS[month0];
          yNum.textContent = String(year);

          const cells = buildMonthMatrix(year, month0);
          const rows = Math.ceil(cells.length / 7);
          table.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;

          for (let i = 0; i < 42; i++) {
            const slot = cellSlots[i];
            if (i >= cells.length) {
              slot.box.style.display = "none";
              continue;
            }
            slot.box.style.display = "flex";
            const c = cells[i];

            slot.box.className = "date-box" +
              (c.dimmed ? " dimmed" : "") +
              (c.isToday ? " today-mark" : "") +
              (slot.isWk ? " weekend" : "") +
              (c.isHoliday ? " holiday" : "");

            slot.solarEl.textContent = String(c.dayVal);
            slot.lunarEl.textContent = c.lunar.text;
            slot.lunarEl.className = "lunar-tag" + (c.lunar.isMonthStart ? " month-start" : "");
            slot.festEl.textContent = c.festival || "";
            slot.festEl.style.display = c.festival ? "block" : "none";
          }
        }
      };
    }

    const zoomViewport = document.getElementById("zoomViewport");
    const calendarShell = document.getElementById("calendarShell");
    const flipStage = document.getElementById("flipStage");

    // 預先掛載常駐四層圖層 + 中縫雙線圈
    const baseTopSlot = createPersistentTopSlot(1, false);
    const baseBotSlot = createPersistentBottomSlot(1, false);
    const leafTopSlot = createPersistentTopSlot(10, true);
    const leafBotSlot = createPersistentBottomSlot(10, true);

    const coilBridge = document.createElement("div");
    coilBridge.className = "coil-bridge";
    for (let i = 0; i < COIL_COUNT; i++) {
      const unit = document.createElement("div");
      unit.className = "coil-unit";
      const wire = document.createElement("span");
      wire.className = "coil-wire";
      unit.appendChild(wire);
      coilBridge.appendChild(unit);
    }

    flipStage.appendChild(baseTopSlot.pane);
    flipStage.appendChild(baseBotSlot.pane);
    flipStage.appendChild(leafTopSlot.pane);
    flipStage.appendChild(leafBotSlot.pane);
    flipStage.appendChild(coilBridge);

    const startNow = new Date();
    let activeYear = startNow.getFullYear();
    let activeMonth0 = startNow.getMonth();

    function offsetYearMonth(y, m0, step) {
      const sum = y * 12 + m0 + step;
      return {
        year: Math.floor(sum / 12),
        month0: ((sum % 12) + 12) % 12
      };
    }

    function syncIdleView(year, month0) {
      baseTopSlot.bind(year, month0);
      baseBotSlot.bind(year, month0);
      baseTopSlot.shade.style.opacity = "0";
      baseBotSlot.shade.style.opacity = "0";

      leafTopSlot.pane.classList.add("hidden-leaf");
      leafBotSlot.pane.classList.add("hidden-leaf");
      leafTopSlot.pane.style.transform = "translate3d(0,0,0) rotateX(0deg)";
      leafBotSlot.pane.style.transform = "translate3d(0,0,0) rotateX(0deg)";
    }

    // 零延遲常駐圖層 3D 雙線圈翻頁控制器
    class ZeroLagFlipController {
      constructor() {
        this.state = "idle"; // idle | dragging | settling
        this.dir = 1;
        this.progress = 0;
        this.targetYM = null;
        this.rafId = null;
      }

      begin(dir) {
        if (this.state === "settling") {
          this.finish(this.progress > 0.3);
        }
        if (this.state !== "idle") return false;

        this.state = "dragging";
        this.dir = dir;
        this.progress = 0;
        this.targetYM = offsetYearMonth(activeYear, activeMonth0, dir);

        if (dir > 0) {
          baseTopSlot.bind(activeYear, activeMonth0);
          baseBotSlot.bind(this.targetYM.year, this.targetYM.month0);
          leafBotSlot.bind(activeYear, activeMonth0);
          leafTopSlot.bind(this.targetYM.year, this.targetYM.month0);
        } else {
          baseTopSlot.bind(this.targetYM.year, this.targetYM.month0);
          baseBotSlot.bind(activeYear, activeMonth0);
          leafTopSlot.bind(activeYear, activeMonth0);
          leafBotSlot.bind(this.targetYM.year, this.targetYM.month0);
        }

        leafTopSlot.pane.classList.remove("hidden-leaf");
        leafBotSlot.pane.classList.remove("hidden-leaf");
        this.renderAtProgress(0);
        return true;
      }

      renderAtProgress(p) {
        if (this.state === "idle") return;
        this.progress = Math.max(0, Math.min(1, p));

        const deg = this.progress * 180;
        const openSin = Math.sin(this.progress * Math.PI);
        const leafShade = String(openSin * 0.34);

        if (this.dir > 0) {
          leafBotSlot.pane.style.transform = `translate3d(0,0,0) rotateX(${deg}deg)`;
          leafTopSlot.pane.style.transform = `translate3d(0,0,0) rotateX(${deg - 180}deg)`;

          leafBotSlot.pane.style.zIndex = deg < 90 ? "12" : "8";
          leafTopSlot.pane.style.zIndex = deg >= 90 ? "12" : "8";

          baseTopSlot.shade.style.opacity = String(openSin * 0.42);
          baseBotSlot.shade.style.opacity = String((1 - this.progress) * 0.24);
        } else {
          leafTopSlot.pane.style.transform = `translate3d(0,0,0) rotateX(${-deg}deg)`;
          leafBotSlot.pane.style.transform = `translate3d(0,0,0) rotateX(${180 - deg}deg)`;

          leafTopSlot.pane.style.zIndex = deg < 90 ? "12" : "8";
          leafBotSlot.pane.style.zIndex = deg >= 90 ? "12" : "8";

          baseTopSlot.shade.style.opacity = String((1 - this.progress) * 0.24);
          baseBotSlot.shade.style.opacity = String(openSin * 0.42);
        }

        leafTopSlot.shade.style.opacity = leafShade;
        leafBotSlot.shade.style.opacity = leafShade;
      }

      settle(complete, velocity = 0) {
        if (this.state === "idle") return;
        this.state = "settling";

        const startP = this.progress;
        const endP = complete ? 1 : 0;
        const remain = Math.abs(endP - startP);
        const speedBoost = Math.min(0.55, Math.abs(velocity) * 0.18);
        const duration = Math.max(130, Math.min(340, remain * 360 * (1 - speedBoost)));
        const startTime = performance.now();

        if (complete) {
          playPaperFlipSound(this.dir, Math.max(0.45, remain));
        }

        const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

        const tick = (now) => {
          const rawT = Math.min(1, (now - startTime) / duration);
          const e = easeOutCubic(rawT);
          const curP = startP + (endP - startP) * e;
          this.renderAtProgress(curP);

          if (rawT < 1) {
            this.rafId = requestAnimationFrame(tick);
          } else {
            this.finish(complete);
          }
        };

        this.rafId = requestAnimationFrame(tick);
      }

      finish(committed) {
        if (this.rafId) {
          cancelAnimationFrame(this.rafId);
          this.rafId = null;
        }
        if (committed && this.targetYM) {
          activeYear = this.targetYM.year;
          activeMonth0 = this.targetYM.month0;
        }
        syncIdleView(activeYear, activeMonth0);
        this.state = "idle";
      }
    }

    const flipCtrl = new ZeroLagFlipController();

    // 雙指捏合縮放與平移狀態
    let viewScale = 1;
    let viewPanX = 0;
    let viewPanY = 0;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let pinchStartCenter = { x: 0, y: 0 };
    let pinchStartPan = { x: 0, y: 0 };
    let isPinching = false;

    function applyZoomTransform(smooth = false) {
      zoomViewport.style.transition = smooth ? "transform 0.22s cubic-bezier(0.22, 1, 0.36, 1)" : "none";
      zoomViewport.style.transform = `translate3d(${viewPanX}px, ${viewPanY}px, 0) scale(${viewScale})`;
    }

    function clampPan() {
      if (viewScale <= 1.01) {
        viewScale = 1;
        viewPanX = 0;
        viewPanY = 0;
        return;
      }
      const maxX = (calendarShell.clientWidth * (viewScale - 1)) * 0.55;
      const maxY = (calendarShell.clientHeight * (viewScale - 1)) * 0.55;
      viewPanX = Math.max(-maxX, Math.min(maxX, viewPanX));
      viewPanY = Math.max(-maxY, Math.min(maxY, viewPanY));
    }

    function getTouchDist(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.hypot(dx, dy);
    }

    // 單指上下即時翻頁 + 放大狀態下平移 + 雙擊還原
    let pointerActive = false;
    let activeTouchId = null;
    let originY = 0;
    let originX = 0;
    let startPanX = 0;
    let startPanY = 0;
    let lastY = 0;
    let lastTime = 0;
    let velocityY = 0;
    let lastTapTime = 0;

    function startSingleDrag(clientX, clientY, touchId = null) {
      if (flipCtrl.state === "settling") {
        flipCtrl.finish(flipCtrl.progress > 0.3);
      }
      pointerActive = true;
      activeTouchId = touchId;
      originY = clientY;
      originX = clientX;
      startPanX = viewPanX;
      startPanY = viewPanY;
      lastY = clientY;
      lastTime = performance.now();
      velocityY = 0;
    }

    function moveSingleDrag(clientX, clientY) {
      if (!pointerActive) return;

      // 若畫面處於雙指放大狀態，單指改為平移檢視細節
      if (viewScale > 1.05) {
        viewPanX = startPanX + (clientX - originX);
        viewPanY = startPanY + (clientY - originY);
        clampPan();
        applyZoomTransform(false);
        return;
      }

      const now = performance.now();
      const dt = Math.max(6, now - lastTime);
      velocityY = (clientY - lastY) / dt;
      lastY = clientY;
      lastTime = now;

      const dy = clientY - originY;
      if (Math.abs(dy) < 1) return;

      const dir = dy < 0 ? 1 : -1;
      const travelSpan = Math.max(135, calendarShell.clientHeight * 0.36);
      const rawProgress = Math.min(0.99, Math.abs(dy) / travelSpan);

      if (flipCtrl.state === "idle") {
        flipCtrl.begin(dir);
      }

      if (flipCtrl.state === "dragging") {
        if ((flipCtrl.dir > 0 && dy > 3) || (flipCtrl.dir < 0 && dy < -3)) {
          flipCtrl.finish(false);
          originY = clientY;
          return;
        }
        flipCtrl.renderAtProgress(rawProgress);
      }
    }

    function endSingleDrag() {
      if (!pointerActive) return;
      pointerActive = false;
      activeTouchId = null;

      if (flipCtrl.state === "dragging") {
        const fastFlick = (flipCtrl.dir > 0 && velocityY < -0.14) || (flipCtrl.dir < 0 && velocityY > 0.14);
        const shouldComplete = flipCtrl.progress > 0.11 || fastFlick;
        flipCtrl.settle(shouldComplete, velocityY);
      }
    }

    document.addEventListener("touchstart", (e) => {
      if (e.touches.length >= 2) {
        if (flipCtrl.state === "dragging") {
          flipCtrl.settle(false, 0);
        }
        pointerActive = false;
        activeTouchId = null;
        isPinching = true;

        const t1 = e.touches[0];
        const t2 = e.touches[1];
        pinchStartDist = Math.max(10, getTouchDist(t1, t2));
        pinchStartScale = viewScale;
        pinchStartCenter = {
          x: (t1.clientX + t2.clientX) * 0.5,
          y: (t1.clientY + t2.clientY) * 0.5
        };
        pinchStartPan = { x: viewPanX, y: viewPanY };
        return;
      }

      if (e.touches.length === 1 && !isPinching) {
        const now = performance.now();
        const t = e.touches[0];
        if (now - lastTapTime < 260 && viewScale > 1.05) {
          viewScale = 1;
          viewPanX = 0;
          viewPanY = 0;
          applyZoomTransform(true);
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;
        startSingleDrag(t.clientX, t.clientY, t.identifier);
      }
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (e.cancelable) e.preventDefault();

      if (e.touches.length >= 2 && isPinching) {
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const curDist = getTouchDist(t1, t2);
        const curCenter = {
          x: (t1.clientX + t2.clientX) * 0.5,
          y: (t1.clientY + t2.clientY) * 0.5
        };

        viewScale = Math.max(1, Math.min(3.5, pinchStartScale * (curDist / pinchStartDist)));
        viewPanX = pinchStartPan.x + (curCenter.x - pinchStartCenter.x);
        viewPanY = pinchStartPan.y + (curCenter.y - pinchStartCenter.y);
        clampPan();
        applyZoomTransform(false);
        return;
      }

      if (e.touches.length === 1 && pointerActive && !isPinching) {
        const t = Array.from(e.touches).find((item) => item.identifier === activeTouchId) || e.touches[0];
        if (t) moveSingleDrag(t.clientX, t.clientY);
      }
    }, { passive: false });

    document.addEventListener("touchend", (e) => {
      if (e.touches.length < 2 && isPinching) {
        isPinching = false;
        if (viewScale <= 1.04) {
          viewScale = 1;
          viewPanX = 0;
          viewPanY = 0;
          applyZoomTransform(true);
        }
      }
      if (e.touches.length === 0) {
        endSingleDrag();
      }
    }, { passive: true });

    document.addEventListener("touchcancel", () => {
      isPinching = false;
      endSingleDrag();
    }, { passive: true });

    // 滑鼠拖曳與鍵盤上下鍵支援
    document.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      startSingleDrag(e.clientX, e.clientY, null);
    });

    window.addEventListener("mousemove", (e) => {
      if (!pointerActive || activeTouchId !== null) return;
      moveSingleDrag(e.clientX, e.clientY);
    });

    window.addEventListener("mouseup", () => {
      if (activeTouchId === null) endSingleDrag();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "PageUp") {
        e.preventDefault();
        if (flipCtrl.begin(1)) flipCtrl.settle(true, -0.5);
      } else if (e.key === "ArrowDown" || e.key === "PageDown") {
        e.preventDefault();
        if (flipCtrl.begin(-1)) flipCtrl.settle(true, 0.5);
      }
    });

    // 初始化預熱：預先計算前後月份矩陣
    syncIdleView(activeYear, activeMonth0);
    const prevInit = offsetYearMonth(activeYear, activeMonth0, -1);
    const nextInit = offsetYearMonth(activeYear, activeMonth0, 1);
    buildMonthMatrix(prevInit.year, prevInit.month0);
    buildMonthMatrix(nextInit.year, nextInit.month0);
  </script>
</body>
</html>
